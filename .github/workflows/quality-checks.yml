name: Quality checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality-checks:
    name: Validate code and commits
    runs-on: ubuntu-slim

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: >-
          npx --no -- vitest run
          --reporter=agent
          --coverage
          --coverage.reporter=text-summary
          --coverage.include='src/**/*.js'
          --coverage.exclude='src/main.js'
          --coverage.thresholds.lines=80
          --coverage.thresholds.functions=80
          --coverage.thresholds.statements=80
          --coverage.thresholds.branches=70

      - name: Check linting
        run: npx --no -- eslint . --max-warnings=0

      - name: Check formatting
        run: npx --no -- prettier --check .

      - name: Check unused files and dependencies
        run: npx --no -- knip

      - name: Validate commit messages
        run: >-
          npx --no -- commitlint
          --from "${{ github.event.pull_request.base.sha || github.event.before }}"
          --to "${{ github.event.pull_request.head.sha || github.sha }}"
          --verbose
